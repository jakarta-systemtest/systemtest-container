name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    environment: maven-central

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Verify public GPG key availability
        shell: bash
        run: |
          set -euo pipefail

          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ { print $10; exit }')"
          if [ -z "$fingerprint" ]; then
            echo "::error::No GPG signing key was imported."
            exit 1
          fi

          echo "Signing key fingerprint: $fingerprint"

          if curl --fail --silent --show-error "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x${fingerprint}" >/dev/null; then
            echo "Public key found on keyserver.ubuntu.com"
            exit 0
          fi

          if curl --fail --silent --show-error "https://keys.openpgp.org/vks/v1/by-fingerprint/${fingerprint}" >/dev/null; then
            echo "Public key found on keys.openpgp.org"
            exit 0
          fi

          echo "::error::Public GPG key was not found on a supported keyserver."
          echo "::error::Publish the public key before deploying to Maven Central."
          exit 1

      - name: Publish package
        run: mvn -B -Prelease deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
